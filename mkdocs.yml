site_name: Solutions Gallery
site_description: Curated C++ DSA solutions with explanations and categories
repo_url: https://github.com/your-username/your-repo
theme:
  name: material
  features:
    - navigation.tabs
    - content.code.copy
    - content.code.annotate
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Arrays:
      - Two Sum: Arrays/two_sum.md
      - Subarray Sum: Arrays/subarray_sum.md
  - Trees:
      - Inorder Traversal: Trees/inorder_traversal.md
      - BST Insert: Trees/bst_insert.md
  - Graphs:
      - BFS: Graphs/bfs.md
      - Dijkstra: Graphs/dijkstra.md
  - Dynamic Programming:
      - 0/1 Knapsack: Dynamic Programming/knapsack.md
      - Longest Increasing Subsequence: Dynamic Programming/lis.md
